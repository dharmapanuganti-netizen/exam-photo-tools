
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Photo Tools</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #172033;
      margin: 0;
      padding: 20px;
    }
    main {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px #0001;
    }
    h1 { color: #2457d6; }
    p { line-height: 1.6; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      margin: 10px 0;
      padding: 13px;
      font-size: 16px;
    }
    button {
      background: #2457d6;
      color: white;
      border: 0;
      border-radius: 8px;
    }
    canvas { max-width: 100%; margin-top: 15px; }
  </style>
</head>
<body>
  <main>
    <h1>Exam Photo Tools</h1>
    <p>Prepare your photo for online exam and job applications.</p>
    <p>Select a photo to resize it to your required pixel dimensions.</p>

    <label for="photo">Choose your photo</label>
    <input type="file" id="photo" accept="image/*">

    <label for="width">Width in pixels</label>
    <input type="number" id="width" value="200" min="1" max="5000">

    <label for="height">Height in pixels</label>
    <input type="number" id="height" value="230" min="1" max="5000">

    <button onclick="resizePhoto()">Resize photo</button>
    <div id="result"></div>
  </main>

  <script>
    function resizePhoto() {
      const file = document.getElementById('photo').files[0];
      const w = Number(document.getElementById('width').value);
      const h = Number(document.getElementById('height').value);
      const result = document.getElementById('result');
      result.innerHTML = '';

      if (!file || !w || !h || w > 5000 || h > 5000) {
        result.textContent = 'Choose a photo and enter valid dimensions.';
        return;
      }

      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const preview = document.createElement('div');
        const output = document.createElement('div');
        const button = document.createElement('button');
        preview.appendChild(canvas);
        button.textContent = 'Download resized photo';
        button.onclick = function() {
          const link = document.createElement('a');
          link.download = 'resized-photo.jpg';
          link.href = canvas.toDataURL('image/jpeg', 0.9);
          link.click();
        };
        output.appendChild(button);
        result.append(preview, output);
        URL.revokeObjectURL(img.src);
      };
      img.onerror = function() {
        result.textContent = 'Could not open this image. Please try another.';
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(file);
    }
  </script>
</body>
</html>
